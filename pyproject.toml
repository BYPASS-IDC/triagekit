[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triagekit"
version = "0.9.0"
description = "Deep triage and security scanning for open-source maintainers. Multi-stage analysis, heuristic security scanning, structured risk scoring, and actionable findings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TriageKit Contributors" },
]
keywords = [
    "security",
    "triage",
    "pull-request",
    "static-analysis",
    "vulnerability",
    "oss",
    "maintainer",
    "scanner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "PyGithub>=2.3.0",
    "openai>=1.40.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/BYPASS-IDC/triagekit"
Repository = "https://github.com/BYPASS-IDC/triagekit"
Issues = "https://github.com/BYPASS-IDC/triagekit/issues"
Documentation = "https://github.com/BYPASS-IDC/triagekit#readme"

[project.scripts]
triagekit = "triagekit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/triagekit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/triagekit",
    "skills",
    "docs",
    "testbench",
    "examples",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests", "testbench"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
